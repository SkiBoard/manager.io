name: Publish container

on:
  workflow_dispatch:
    inputs:
      manager_version:
        description: "Manager Server release, for example 26.8.14; leave blank to use upstream latest"
        required: false
        type: string
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-manager-server
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve image and Manager version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.manager_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${REQUESTED_VERSION:-}"
          if [[ -z "$version" ]]; then
            version="$(gh api repos/managerhq/ManagerServer/releases/latest --jq '.tag_name')"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected Manager version: $version" >&2
            exit 1
          fi
          for arch in x64 arm64; do
            url="https://github.com/managerhq/ManagerServer/releases/download/${version}/ManagerServer-linux-${arch}.tar.gz"
            curl --fail --location --silent --show-error --head "$url" >/dev/null
          done
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check whether version is already published
        id: existing
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate image metadata
        if: steps.existing.outputs.published != 'true' || github.event_name == 'workflow_dispatch'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.release.outputs.image }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Unofficial Manager Server container
            org.opencontainers.image.description=Community container for Manager Server with headless Chromium PDF support
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.licenses=LicenseRef-FSL-1.1-Apache-2.0

      - name: Build and publish
        if: steps.existing.outputs.published != 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MANAGER_VERSION=${{ steps.release.outputs.version }}
            SOURCE_URL=https://github.com/${{ github.repository }}
            VCS_REF=${{ github.sha }}
            CREATED=${{ steps.release.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: No new Manager release
        if: steps.existing.outputs.published == 'true' && github.event_name != 'workflow_dispatch'
        run: echo "Manager Server ${{ steps.release.outputs.version }} is already published."

