name: Publish container

on:
  workflow_dispatch:
    inputs:
      manager_version:
        description: "Manager Server release, for example 26.8.21.1; leave blank to use upstream latest"
        required: false
        type: string

  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: publish-manager-server
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
      create_release: ${{ steps.decision.outputs.create_release }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve image and Manager version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.manager_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${REQUESTED_VERSION:-}"

          if [[ -z "$version" ]]; then
            version="$(gh api repos/managerhq/Manager/releases/latest --jq '.tag_name')"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Unexpected Manager version: $version" >&2
            exit 1
          fi

          for arch in x64 arm64; do
            url="https://github.com/managerhq/Manager/releases/download/${version}/ManagerServer-linux-${arch}.tar.gz"
            curl --fail --location --silent --show-error --head "$url" >/dev/null
          done

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check whether version is already published
        id: existing
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to publish
        id: decision
        env:
          ALREADY_PUBLISHED: ${{ steps.existing.outputs.published }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$ALREADY_PUBLISHED" != "true" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate image metadata
        if: steps.decision.outputs.create_release == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.release.outputs.image }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Unofficial Manager Server container
            org.opencontainers.image.description=Community container for Manager Server with headless Chromium PDF support
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.licenses=LicenseRef-FSL-1.1-Apache-2.0

      - name: Build and publish
        if: steps.decision.outputs.create_release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MANAGER_VERSION=${{ steps.release.outputs.version }}
            SOURCE_URL=https://github.com/${{ github.repository }}
            VCS_REF=${{ github.sha }}
            CREATED=${{ steps.release.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: No new Manager release
        if: steps.decision.outputs.create_release != 'true'
        run: |
          echo "Manager Server ${{ steps.release.outputs.version }} is already published."

  create-release:
    name: Create GitHub release
    needs: publish
    if: needs.publish.outputs.create_release == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.publish.outputs.image }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "$VERSION" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $VERSION already exists."
            exit 0
          fi

          notes="$(printf 'Docker image: %s:%s\n\nLatest image: %s:latest\n\nUpstream release: https://github.com/managerhq/Manager/releases/tag/%s\n' \
            "$IMAGE" "$VERSION" "$IMAGE" "$VERSION")"

          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Manager Server $VERSION" \
            --notes "$notes"
